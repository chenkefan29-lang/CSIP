<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>污水处理模拟监控系统</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <main class="container">
    <header class="page-header">
      <div>
        <p class="eyebrow">WATER TREATMENT SIMULATOR</p>
        <h1>污水处理模拟监控系统</h1>
        <p>调整工艺参数，观察出水水质和异常情况。</p>
      </div>
      <div class="status-badge" id="statusBadge">等待模拟</div>
    </header>

    <section class="control-panel">
      <div class="control-item">
        <label for="scene">运行场景</label>
        <select id="scene">
          <option value="normal">正常进水</option>
          <option value="shock">冲击负荷</option>
        </select>
      </div>

      <div class="control-item">
        <label for="aeration">曝气量：<span id="aerationValue">3.0</span></label>
        <input id="aeration" type="range" min="1" max="6" step="0.5" value="3">
      </div>

      <div class="control-item">
        <label for="recycleRatio">回流比：<span id="recycleValue">1.0</span></label>
        <input id="recycleRatio" type="range" min="0.5" max="2" step="0.1" value="1">
      </div>

      <button id="simulateButton">更新模拟结果</button>
    </section>

    <section class="process-flow">
      <div class="process-node">进水</div>
      <div class="arrow">→</div>
      <div class="process-node">生化池</div>
      <div class="arrow">→</div>
      <div class="process-node">二沉池</div>
      <div class="arrow">→</div>
      <div class="process-node">出水</div>
    </section>

    <section class="metrics-grid">
      <article class="metric-card">
        <p>出水 COD</p>
        <strong id="codValue">--</strong>
        <span>mg/L</span>
      </article>
      <article class="metric-card">
        <p>出水氨氮</p>
        <strong id="ammoniaValue">--</strong>
        <span>mg/L</span>
      </article>
      <article class="metric-card">
        <p>溶解氧 DO</p>
        <strong id="doValue">--</strong>
        <span>mg/L</span>
      </article>
      <article class="metric-card">
        <p>MLSS</p>
        <strong id="mlssValue">--</strong>
        <span>mg/L</span>
      </article>
    </section>

    <section class="content-grid">
      <article class="chart-panel">
        <h2>24 小时水质变化趋势</h2>
        <canvas id="trendChart"></canvas>
      </article>

      <article class="alert-panel">
        <h2>运行建议</h2>
        <p id="advice">点击“更新模拟结果”开始计算。</p>
        <div id="alerts" class="alerts"></div>
      </article>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
